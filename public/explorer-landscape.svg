<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 620" preserveAspectRatio="xMidYMin slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe7d5"/>
      <stop offset="0.52" stop-color="#e9eddc"/>
      <stop offset="1" stop-color="#f3ebcf"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#879e8a"/>
      <stop offset="1" stop-color="#aeb9a1"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#526f62"/>
      <stop offset="1" stop-color="#82927a"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#294f46"/>
      <stop offset="1" stop-color="#52705d"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9d6c6" stop-opacity=".24"/>
      <stop offset=".5" stop-color="#f5fbef" stop-opacity=".92"/>
      <stop offset="1" stop-color="#a9cfbf" stop-opacity=".18"/>
    </linearGradient>
    <filter id="mist" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="map" width="150" height="100" patternUnits="userSpaceOnUse">
      <path d="M-10 75 C35 35 70 115 125 62 S190 55 205 25" fill="none" stroke="#68775e" stroke-width="1" opacity=".13"/>
      <path d="M-20 92 C30 54 90 128 160 75" fill="none" stroke="#68775e" stroke-width="1" opacity=".09"/>
    </pattern>
  </defs>

  <rect width="1800" height="620" fill="url(#sky)"/>
  <circle cx="1370" cy="120" r="96" fill="#f4dca2" opacity=".42"/>
  <ellipse cx="910" cy="305" rx="750" ry="115" fill="#f1f2df" opacity=".5" filter="url(#mist)"/>

  <!-- distant mountain chain -->
  <path d="M0 335 L125 250 L230 310 L365 180 L455 275 L570 155 L665 285 L790 208 L905 322 L1015 238 L1128 320 L1268 188 L1380 292 L1492 220 L1620 330 L1730 245 L1800 302 L1800 620 L0 620 Z" fill="url(#far)" opacity=".68"/>
  <path d="M300 238 L365 180 L408 244 L365 226 Z M520 205 L570 155 L612 225 L571 203 Z M1218 243 L1268 188 L1314 255 L1268 232 Z" fill="#edf1dc" opacity=".8"/>

  <!-- middle ridge -->
  <path d="M0 420 L150 345 L280 395 L430 270 L535 392 L690 300 L820 408 L958 286 L1086 398 L1215 314 L1336 415 L1455 300 L1590 395 L1715 322 L1800 390 L1800 620 L0 620 Z" fill="url(#mid)" opacity=".78"/>

  <!-- waterfall cliff on right -->
  <path d="M1430 252 C1495 240 1565 255 1620 300 C1668 340 1690 405 1692 620 L1420 620 C1418 510 1408 386 1430 252 Z" fill="#4a695a" opacity=".82"/>
  <path d="M1547 270 C1553 334 1543 386 1558 435 C1568 468 1557 526 1548 620 L1606 620 C1596 535 1610 481 1598 435 C1582 378 1594 322 1583 282 Z" fill="url(#water)"/>
  <path d="M1556 276 C1560 340 1552 383 1566 430 C1579 472 1564 522 1560 620" fill="none" stroke="#f4faf0" stroke-width="10" opacity=".75"/>
  <ellipse cx="1575" cy="540" rx="100" ry="28" fill="#dcebdd" opacity=".35" filter="url(#mist)"/>

  <!-- near hills -->
  <path d="M0 500 C160 420 295 468 420 425 C560 376 690 445 790 420 C950 380 1050 470 1185 430 C1320 390 1460 450 1800 418 L1800 620 L0 620 Z" fill="url(#near)" opacity=".82"/>
  <path d="M0 520 C220 465 365 540 545 493 C720 448 855 540 1020 500 C1220 450 1430 535 1800 470 L1800 620 L0 620 Z" fill="#375a4c" opacity=".62"/>

  <!-- river -->
  <path d="M830 620 C930 565 1080 563 1190 531 C1320 492 1438 493 1580 506 C1420 535 1320 575 1270 620 Z" fill="#c4dbcd" opacity=".55"/>

  <!-- explorer/map texture -->
  <rect width="1800" height="620" fill="url(#map)"/>
  <g fill="none" stroke="#536955" stroke-width="2" opacity=".13">
    <circle cx="185" cy="145" r="68"/><circle cx="185" cy="145" r="46"/>
    <path d="M185 62 V228 M102 145 H268 M126 86 L244 204 M244 86 L126 204"/>
    <path d="M360 90 C515 55 648 82 785 45" stroke-dasharray="6 11"/>
    <path d="M1130 92 C1210 135 1304 85 1390 126" stroke-dasharray="5 10"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#355548" stroke-width="3" stroke-linecap="round" opacity=".52">
    <path d="M1040 134 q18 -15 36 0 q18 -15 36 0"/>
    <path d="M1135 166 q13 -11 26 0 q13 -11 26 0"/>
    <path d="M1320 115 q16 -13 32 0 q16 -13 32 0"/>
  </g>
</svg>
