<script>
  // This is a secondary view only. Do not boot a second authenticated app.
  window.__MSG_WORKSPACE_PANE__ = true;
  window.MSGWorkspacePane = true;
  const nativeFetch = window.fetch.bind(window);
  window.fetch = (input, init) => {
    const raw = typeof input === 'string' ? input : (input && input.url) || '';
    try {
      const u = new URL(raw, location.href);
      if (u.pathname === '/api/topic-feeds/daily-open') {
        return Promise.resolve(new Response(JSON.stringify({ workspacePane:true }), {status:200, headers:{'Content-Type':'application/json'}}));
      }
    } catch {}
    return nativeFetch(input, init);
  };
</script>
