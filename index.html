<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<meta content="Mark, Set, Go! reading-speed test and reading accelerator." name="description"/>
<title>Mark, Set, Go!</title>
<link href="/styles.css?v=5.42" rel="stylesheet"/>
<script defer src="/reader/BookModel.js?v=3.2.1-stable-recovery"></script>
<script defer src="/reader/SessionManager.js?v=3.2.1-stable-recovery"></script>
<script defer src="/reader/ReaderEngine.js?v=3.2.1-stable-recovery"></script>
<script defer src="/reader/VirtualRenderer.js?v=3.2.1-stable-recovery"></script>
<script defer src="/app.js?v=5.42"></script>
</head>
<body>
<header class="site-header">
<a class="brand" data-action="home" href="#">Mark, Set, Go!</a>
<nav aria-label="Main navigation">
<button class="top-reader-return" data-action="reader" type="button" title="Return to the current reader"><span class="nav-icon" aria-hidden="true">↩</span> Reader</button>
<details>
<summary><span class="nav-icon" aria-hidden="true">▥</span> Library</summary>
<div class="menu-popover">
<button data-action="reading-list" type="button"><span class="menu-icon">☷</span> My Reading List</button>
<button data-action="progress-dashboard" type="button"><span class="menu-icon">↗</span> Reading Progress</button>
<button data-read="upload" type="button"><span class="menu-icon">⇧</span> Import Book / Text</button>
<button data-read="illustrated-upload" type="button"><span class="menu-icon">▧</span> Import Illustrated Book</button>
<button data-read="url" type="button"><span class="menu-icon">⌁</span> Read from URL</button>
</div>
</details>
<details>
<summary><span class="nav-icon" aria-hidden="true">⌕</span> Discover</summary>
<div class="menu-popover">
<button data-read="unified-library" type="button"><span class="menu-icon">⌕</span> Search All Libraries</button>
<button data-read="gutenberg" type="button"><span class="menu-icon">G</span> Project Gutenberg</button>
<button data-read="great-books" type="button"><span class="menu-icon">★</span> Great Books Library</button>
<button data-read="syntopicon" type="button"><span class="menu-icon">◎</span> Syntopicon · Great Ideas</button>
<button data-read="bible" type="button"><span class="menu-icon">✦</span> Bible Study</button>
<button data-read="current-reading" type="button"><span class="menu-icon">◎</span> News, Sports &amp; Interests</button>
<button data-read="news" type="button"><span class="menu-icon">◫</span> Today's News</button>
<button data-read="weather" type="button"><span class="menu-icon">☼</span> Local Weather</button>
<button data-read="frankenstein-demo" type="button"><span class="menu-icon">▧</span> Illustrated Demo</button>
</div>
</details>
<details>
<summary><span class="nav-icon" aria-hidden="true">↗</span> Learn</summary>
<div class="menu-popover">
<button data-test="gatsby" type="button"><span class="menu-icon">⏱</span> WPM Test · Gatsby</button>
<button data-test="hound" type="button"><span class="menu-icon">⏱</span> WPM Test · Hound</button>
<button data-test="cities" type="button"><span class="menu-icon">⏱</span> WPM Test · Two Cities</button>

<button data-action="vocabulary-builder" type="button"><span class="menu-icon">Aa</span> Vocabulary Builder</button>
</div>
</details>
<details>
<summary><span class="nav-icon" aria-hidden="true">♫</span> Music</summary>
<div class="menu-popover">
<button data-action="music" type="button"><span class="menu-icon">♫</span> Music Library</button>
<button data-music-quick="lofi-study" type="button">Lofi for Reading</button>
<button data-music-quick="classical-reading" type="button">Classical Reading</button>
<button data-music-quick="rain-focus" type="button">Rain &amp; Focus</button>
</div>
</details>
<details>
<summary><span class="nav-icon" aria-hidden="true">?</span> Help</summary>
<div class="menu-popover">
<button data-action="help" type="button"><span class="menu-icon">?</span> Help</button>
<button data-action="about" type="button"><span class="menu-icon">ⓘ</span> About</button>
</div>
</details>
</nav>
</header>
<main aria-live="polite" class="app-shell" id="app" tabindex="-1"></main>
<aside aria-label="Music player" class="music-dock" hidden="" id="music-dock">
<div class="music-dock-bar">
<div><strong id="music-now-title">Music</strong><span id="music-now-source">YouTube</span></div>
<div class="music-dock-actions">
<button aria-label="Try another result" id="music-next" type="button" hidden>↻</button>
<button aria-label="Minimize music player" id="music-minimize" type="button">—</button>
<button aria-label="Close music player" id="music-close" type="button">×</button>
</div>
</div>
<div class="music-player-wrap" id="music-player-wrap">
<iframe allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen="" id="music-player" title="YouTube music player"></iframe>
</div>
</aside>
<footer>Reading practice tool · Browser edition</footer>
</body>
</html>
